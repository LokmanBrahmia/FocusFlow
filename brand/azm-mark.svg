<!--
  Azm mark (source). An abstract ع drawn as one continuous stroke: a small
  upper loop flowing into a wider progress arc, ending in a "next step" dot.
  24-unit grid, stroke 2.2, round caps. Colours use currentColor (stroke)
  and --azm-dot (dot) so the mark adapts to light and dark surfaces.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none">
  <path d="M14.44 5.69A3.1 3.1 0 1 0 12 10.7A4.5 4.5 0 1 0 15.55 17.97" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
  <circle cx="17.33" cy="15.69" r="1.35" fill="var(--azm-dot, currentColor)"/>
</svg>
