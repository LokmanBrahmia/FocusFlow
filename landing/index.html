<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>FocusFlow — Pomodoro timer and study planner for your desktop</title>
    <meta
      name="description"
      content="FocusFlow helps you organize your tasks, focus with Pomodoro sessions, and understand how you spend your time. Works offline on Fedora, Ubuntu and Windows; your data stays on your computer."
    />
    <meta name="theme-color" content="#0E1016" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="FocusFlow" />
    <meta property="og:title" content="FocusFlow — Take control of your time. Focus on what matters." />
    <meta
      property="og:description"
      content="An offline Pomodoro timer, task manager and study planner for Fedora, Ubuntu and Windows."
    />
    <!--og-absolute-->
    <meta name="twitter:card" content="summary_large_image" />

    <script>
      // Apply a saved theme before paint (dark is the default).
      try {
        if (localStorage.getItem('focusflow-theme') === 'light') document.documentElement.classList.remove('dark')
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
