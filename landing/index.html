<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Azm (عَزم) — Steady focus. Meaningful progress.</title>
    <meta
      name="description"
      content="Azm is a calm focus timer, task manager and study planner for your desktop. Works offline on Fedora, Ubuntu and Windows; your data stays on your computer."
    />
    <meta name="theme-color" content="#131517" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Azm" />
    <meta property="og:title" content="Azm — Steady focus. Meaningful progress." />
    <meta
      property="og:description"
      content="A calm, offline focus timer, task manager and study planner for Fedora, Ubuntu and Windows."
    />
    <!--og-absolute-->
    <meta name="twitter:card" content="summary_large_image" />

    <script>
      // Apply a saved theme before paint (dark is the default). The storage key
      // keeps its FocusFlow-era name so returning visitors keep their choice.
      try {
        if (localStorage.getItem('focusflow-theme') === 'light') document.documentElement.classList.remove('dark')
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
