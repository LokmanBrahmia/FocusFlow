<!doctype html>
<html lang="ar" dir="rtl" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>عَزم — بِعزمٍ، خطوةً بعد خطوة</title>
    <meta
      name="description"
      content="عَزم مؤقّت تركيز هادئ ومدير مهام ومخطِّط دراسة لحاسوبك. يعمل دون إنترنت على Fedora وUbuntu وWindows، وتبقى بياناتك على جهازك."
    />
    <meta name="theme-color" content="#131517" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="عَزم Azm" />
    <meta property="og:locale" content="ar_AR" />
    <meta property="og:locale:alternate" content="en_GB" />
    <meta property="og:title" content="عَزم — بِعزمٍ، خطوةً بعد خطوة" />
    <meta
      property="og:description"
      content="مؤقّت تركيز ومدير مهام ومخطِّط دراسة هادئ، يعمل دون إنترنت على Fedora وUbuntu وWindows. بالعربية والإنجليزية."
    />
    <!--og-absolute-->
    <meta name="twitter:card" content="summary_large_image" />

    <script>
      // Before paint: the saved theme (dark is the default; the key keeps its
      // FocusFlow-era name) and the language (Arabic is the default; ?lang=en
      // opens English), so the page never flashes in the wrong direction.
      try {
        var root = document.documentElement
        if (localStorage.getItem('focusflow-theme') === 'light') root.classList.remove('dark')
        var q = new URLSearchParams(location.search).get('lang')
        var l = q === 'en' || q === 'ar' ? q : localStorage.getItem('azm-site-language')
        if (l === 'en') {
          root.lang = 'en'
          root.dir = 'ltr'
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
