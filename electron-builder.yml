# FocusFlow packaging. Version comes from package.json; nothing here repeats it.
# Targets: Fedora (RPM), Ubuntu/Debian (DEB), Windows (NSIS), all x64.
# Build with the npm scripts (dist:linux, dist:win), which always pass
# --publish never: releases are created by .github/workflows/release.yml.
appId: com.focusflow.app
productName: FocusFlow
copyright: Copyright © FocusFlow contributors
directories:
  buildResources: build
  output: release

files:
  - out/**/*
  - package.json
  - '!**/*.{ts,map}'
  # The website is a separate project; never scan or package it.
  - '!landing{,/**/*}'
  # better-sqlite3: ship only the runtime (lib/ + this platform's prebuilt
  # binary). The SQLite sources, build scripts, any locally compiled build/
  # folder and other platforms' binaries are left out.
  - '!node_modules/better-sqlite3/{deps,src,build}/**'
  - '!node_modules/better-sqlite3/{binding.gyp,README.md}'
  # Each target keeps only its own prebuilt binary (see linux/win/mac "files").
  # Not ${platform}: that macro is the *build* machine's OS, which would ship
  # the wrong binary in a cross-build.

extraResources:
  - from: resources/icons
    to: icons
    filter:
      - '*.png'

# better-sqlite3 13 ships N-API prebuilds: one binary works in Node and in any
# Electron version, so no ABI rebuild is needed (scripts/verify-native.mjs
# checks this in CI). Native files cannot load from inside app.asar.
asarUnpack:
  - node_modules/better-sqlite3/**/*
npmRebuild: false

# Update feed for electron-updater (Windows). Owner and repo are inferred from
# package.json "repository"; nothing is hardcoded here. This generates
# app-update.yml inside the app and latest.yml next to the installer. It does
# NOT upload anything: every build script passes --publish never, and the
# release workflow attaches files to a draft release itself.
publish:
  - provider: github
    releaseType: draft

linux:
  files:
    - '!node_modules/better-sqlite3/prebuilds/!(linux-x64).node'
  syncDesktopName: true
  icon: build/icon.png
  category: Office
  synopsis: Pomodoro timer and study planner
  description: Offline Pomodoro timer, task manager and study planner. Your data stays on your computer.
  maintainer: FocusFlow maintainers
  vendor: FocusFlow
  executableName: focusflow
  target:
    - target: deb
      arch: [x64]
    - target: rpm
      arch: [x64]
  desktop:
    entry:
      StartupWMClass: FocusFlow
      Keywords: pomodoro;timer;study;tasks;planner;focus;

deb:
  artifactName: ${productName}-${version}_amd64.${ext}
  # electron-builder's default list misses libgbm1 and libasound2, which
  # Electron needs: without them the app fails to start on a clean Ubuntu
  # ("libgbm.so.1: cannot open shared object file"). "t64 | old" pairs
  # resolve on Ubuntu 24.04+, where these libraries were renamed.
  depends:
    - libgtk-3-0t64 | libgtk-3-0
    - libnotify4
    - libnss3
    - libxss1
    - libxtst6
    - xdg-utils
    - libatspi2.0-0t64 | libatspi2.0-0
    - libuuid1
    - libsecret-1-0
    - libgbm1
    - libasound2t64 | libasound2

rpm:
  artifactName: ${productName}-${version}.x86_64.${ext}

# Optional extra Linux format (npm run dist:appimage); not part of releases.
appImage:
  artifactName: ${productName}-${version}-x86_64.${ext}

win:
  files:
    - '!node_modules/better-sqlite3/prebuilds/!(win32-x64).node'
  icon: build/icon.png
  target:
    - target: nsis
      arch: [x64]

nsis:
  artifactName: ${productName}-Setup-${version}.${ext}
  oneClick: false
  # Per-user install: no administrator rights needed, nothing written to Program Files.
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: FocusFlow
  # Uninstalling keeps the user's data in %APPDATA%\FocusFlow.
  deleteAppDataOnUninstall: false

mac:
  files:
    - '!node_modules/better-sqlite3/prebuilds/!(darwin-*).node'
  icon: build/icon.png
  category: public.app-category.productivity
  target:
    - dmg
