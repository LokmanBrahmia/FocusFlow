# Builds Azm (formerly FocusFlow) for Fedora (RPM), Ubuntu (DEB) and Windows (NSIS EXE).
#
# - Manual run (Actions → Release → Run workflow): checks, tests, builds and
#   uploads the packages as workflow artifacts. Nothing is released.
# - Pushing a tag vX.Y.Z that matches package.json and points at a commit on
#   main: the same, then creates a DRAFT GitHub Release with the packages
#   attached. You review it and click "Publish release"; nothing becomes
#   public until then. Versions with a suffix (v0.2.0-beta.1) are marked as
#   prereleases, so the landing page and the in-app update check (both use
#   the latest stable release) ignore them.
name: Release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: '22'

jobs:
  verify:
    name: Checks and tests
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Tag matches package.json and is on main
        id: version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          node scripts/check-release-version.mjs "$GITHUB_REF_NAME"
          git fetch origin main --quiet
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag $GITHUB_REF_NAME points at a commit that is not on main. Release refused."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Native module loads in Node and Electron
        run: npm run verify:native
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

  linux:
    name: Linux packages (DEB, RPM)
    needs: verify
    # Oldest supported Ubuntu LTS runner: packages built here are installed
    # and smoke-tested in clean containers below.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Packaging tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq rpm xvfb >/dev/null
      - run: npm ci
      - name: Build app
        run: npm run build
      - name: UI tests (Playwright, virtual display)
        run: xvfb-run -a npx playwright test
      - name: Package DEB and RPM
        run: node scripts/package.mjs --linux --x64 --publish never
      - name: Smoke-test the packaged app
        run: xvfb-run -a release/linux-unpacked/focusflow --smoke-test
      - name: Install-test DEB (Ubuntu 22.04) and RPM (Fedora 41) in clean containers
        run: scripts/test-linux-packages.sh docker
      - uses: actions/upload-artifact@v4
        with:
          name: focusflow-linux
          path: |
            release/*.deb
            release/*.rpm
          if-no-files-found: error
          retention-days: 14

  windows:
    name: Windows installer (NSIS)
    needs: verify
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Build app
        run: npm run build
      - name: Package NSIS installer
        run: node scripts/package.mjs --win --x64 --publish never
      - name: Check update metadata matches the installer
        shell: pwsh
        run: |
          # electron-updater reads latest.yml from the release and app-update.yml from the app.
          $installer = Get-ChildItem release -Filter 'Azm-Setup-*.exe' | Select-Object -First 1
          $latest = Get-Content release/latest.yml -Raw
          Write-Host $latest
          if ($latest -notmatch "path: $([regex]::Escape($installer.Name))") { throw 'latest.yml does not point at the installer' }
          if ($latest -notmatch 'sha512: ') { throw 'latest.yml has no sha512 checksum' }
          if (-not (Test-Path "release/$($installer.Name).blockmap")) { throw 'Installer blockmap missing' }
          $feed = Get-Content release/win-unpacked/resources/app-update.yml -Raw
          Write-Host $feed
          $owner, $repo = $env:GITHUB_REPOSITORY.Split('/')
          if ($feed -notmatch "owner: $owner" -or $feed -notmatch "repo: $repo") { throw 'app-update.yml does not point at this repository' }
      - name: Install silently, then smoke-test the installed app
        shell: pwsh
        run: |
          $installer = Get-ChildItem release -Filter 'Azm-Setup-*.exe' | Select-Object -First 1
          if (-not $installer) { throw 'Installer not found' }
          $p = Start-Process -FilePath $installer.FullName -ArgumentList '/S' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Installer exited with $($p.ExitCode)" }
          # Per-user NSIS installs go under %LOCALAPPDATA%\Programs.
          $exe = Get-ChildItem (Join-Path $env:LOCALAPPDATA 'Programs') -Recurse -Filter 'Azm.exe' -ErrorAction SilentlyContinue |
            Select-Object -First 1 -ExpandProperty FullName
          if (-not $exe) { throw 'Installed Azm.exe not found under %LOCALAPPDATA%\Programs' }
          Write-Host "Installed at $exe"
          $env:FOCUSFLOW_SMOKE_REPORT = Join-Path $env:RUNNER_TEMP 'smoke.json'
          $run = Start-Process -FilePath $exe -ArgumentList '--smoke-test' -Wait -PassThru
          Get-Content $env:FOCUSFLOW_SMOKE_REPORT
          if ($run.ExitCode -ne 0) { throw "Smoke test failed with exit code $($run.ExitCode)" }
      - uses: actions/upload-artifact@v4
        with:
          name: focusflow-windows
          # The installer plus the files electron-updater needs for in-app updates.
          path: |
            release/Azm-Setup-*.exe
            release/Azm-Setup-*.exe.blockmap
            release/latest.yml
          if-no-files-found: error
          retention-days: 14

  release:
    name: Draft GitHub Release
    needs: [verify, linux, windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: packages
          merge-multiple: true
      - name: Create draft release with packages attached
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.verify.outputs.version }}
          PRERELEASE: ${{ needs.verify.outputs.prerelease }}
        run: |
          ls -l packages
          flags=(--draft --verify-tag --generate-notes --title "Azm $VERSION")
          if [ "$PRERELEASE" = "true" ]; then flags+=(--prerelease); fi
          # latest.yml + .blockmap let installed Windows copies update in-app.
          # Linux updates are announced from the release itself (no extra files).
          gh release create "$GITHUB_REF_NAME" packages/*.rpm packages/*.deb packages/*.exe \
            packages/*.exe.blockmap packages/latest.yml "${flags[@]}"
          echo "Draft created. Review it at https://github.com/$GITHUB_REPOSITORY/releases and publish when ready." >> "$GITHUB_STEP_SUMMARY"
